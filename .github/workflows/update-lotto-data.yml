name: Update Lotto Data

on:
  schedule:
    # Korea Standard Time: Saturday 21:20 and 22:20
    - cron: "20 12 * * 6"
    - cron: "20 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lotto-data-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch newly published draws
        run: python scripts/update_latest.py

      - name: Build static data feed
        run: python scripts/build_feed.py

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data public; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data public
            git commit -m "data: update Lotto draw feed"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
